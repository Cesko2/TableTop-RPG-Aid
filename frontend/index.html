<!-- 
  index.html
  The purpose of the index.html file here is to serve as the landing page for anyone who tries to access our web app, in this case it will be the sign on page.
  The reason it is named index.html instead of sign_on is because from what I recall of html, when you have multiple html files, when you launch it will automatically
  search for whichever is named index and open that one first. In anycase, this file is the sign on file, specifically since it is the html file, it will contain all the
  formatting for the webpage, creating prompt boxes and so on, which will then be styilized by the associated css file, and tied to the associated js file for actually
  computing any of the data it takes in.
 -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TableTop RPG Aid - Sign In</title>
    <link rel="stylesheet" href="css/sign_on.css">
</head>
<body>
    <div class="fantasy-background" aria-hidden="true">
        <div class="scene-layer">
            <div class="background-image"></div>
            <div class="portal-shimmer"></div>
            <div class="firelight fire-one"></div>
            <div class="firelight fire-two"></div>
            <div class="firelight fire-three"></div>
            <div class="firelight fire-four"></div>
        </div>
        <div class="portal-light"></div>

        <div class="embers">
            <span></span><span></span><span></span>
            <span></span><span></span><span></span>
            <span></span><span></span><span></span>
            <span></span><span></span><span></span>
        </div>
    </div>

    <main class="login-container">

        <div class="ornament" aria-hidden="true">✦</div>
        <p class="eyebrow">WELCOME TO</p>

        <h1>TableTop RPG Aid</h1>
        <p class="subtitle">Your adventure begins here</p>

        <div class="decorative-rule" aria-hidden="true">
            <span>◆</span>
        </div>

        <div class="login-card">
            <h2>Enter the Realm</h2>
            <p class="login-description">
                Sign in to continue your adventure.
            </p>

            <form>
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit">
                    Enter the Realm <span aria-hidden="true">→</span>
                </button>
            </form>

            <p class="signup-text">
                New adventurer? Account creation coming soon.
            </p>
        </div>
    </main>

    <script src="js/sign_on.js"></script>
</body>
</html>
